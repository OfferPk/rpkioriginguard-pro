<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchRpki" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchRpki)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    BGP &amp; RPKI Architecture: Sub-Prefix Hijacks vs Strict Route Origin Validation (ROV)
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#140e18" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Loose MaxLength &amp; No Drop-Invalid
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#080c1c" stroke="#212c58"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">ROA: 192.0.2.0/20 MaxLength /24 (Loose!)</text>
  <text x="70" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Routers accept Invalids &bull; No real-time BGP telemetry</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">OUTAGES &amp; ATTACK VECTORS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Attacker AS666 injects rogue /24 sub-prefix</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; BGP Longest Prefix Match diverts 100% of /24 traffic!</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Engineers de-aggregate /23 without updating ROA</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Tier-1 transit drops invalid route: Total service blackout</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC BGP HIJACKS &amp; TRANSIT BLACKHOLES</text>

  <!-- Right: Hardened Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#091826" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: RPKIOriginGuard Pro Zero-Trust ROV
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#080c1c" stroke="#212c58"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">ROA: 198.51.100.0/22 MaxLength /22 (Strict!)</text>
  <text x="560" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Dual RTR Cache Validators &bull; Drop-Invalid Policy on eBGP</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ZERO-TRUST SECURITY GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; RFC 9319 Strict MaxLength closes sub-prefix attack window</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Tier-1 transits immediately discard rogue /24 as RPKI Invalid</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Redundant RTR validator feeds prevent cache failure</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Pre-commit NetDevOps gating eliminates self-inflicted outages</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">100% SERVICE AVAILABILITY &amp; AUTHENTICATED BGP</text>
</svg>
